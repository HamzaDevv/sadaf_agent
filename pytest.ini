[pytest]
# Keep strict mode — all async tests must be explicitly marked @pytest.mark.asyncio
asyncio_mode = strict

# Use function-scoped event loop per test (default, but explicit for clarity).
# Avoids accumulated background tasks competing across turns in a shared session loop,
# which caused 10-16s latency spikes in turns 8-10 with session scope.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    # Suppress pytest-asyncio's own deprecation warning about loop scope (handled above)
    ignore::pytest.PytestDeprecationWarning
    # The Groq/httpx SDK emits this when its internal connection pool objects are GC'd
    # after the function-scoped event loop closes. The exact class name varies between
    # runs (BaseApiClient.aclose or AsyncClient.aclose) depending on GC ordering.
    # This is a library-internal cleanup issue; our GroqProxyImpl.close() is still
    # called as best-effort via conftest.py. No requests are dropped.
    ignore:coroutine '.*[Cc]lient.*\.aclose' was never awaited:RuntimeWarning
    ignore:coroutine 'BaseApiClient\.aclose' was never awaited:RuntimeWarning
