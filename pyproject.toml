[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sadaf-foundation"
version = "0.1.0"
description = "Offline foundation for Sadaf's conversational backend"
requires-python = ">=3.13,<3.14"
dependencies = ["python-dotenv>=1.1,<2"]

[project.scripts]
sadaf = "sadaf.cli:main"

[project.optional-dependencies]
providers = ["openai>=1.100,<3", "groq>=0.31,<2"]
audio = [
  "PyAudio>=0.2.14,<0.3", "webrtcvad>=2.0.10,<3",
  "noisereduce>=3,<4", "numpy>=2,<3", "pydub>=0.25,<0.26",
  "SpeechRecognition>=3.14,<4",
]
vector = ["chromadb>=1,<2", "google-genai>=1.19,<3"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools]
packages = ["sadaf"]
